[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secureforge"
version = "0.1.0"
description = "Continuous security verification and release gate for web and API applications."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
{name = "Vikash Choudhary"}
]
dependencies = [
"typer>=0.12,<1.0",
"PyYAML>=6.0,<7.0",
"pydantic>=2.0,<3.0",
"requests>=2.31,<3.0"
]

[project.optional-dependencies]
dev = [
"pytest>=8.0,<9.0",
"pytest-cov>=5.0,<7.0"
]

[project.scripts]
secureforge = "secureforge.cli.main:app"

[tool.setuptools.packages.find]
include = ["secureforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.coverage.run]
source = ["secureforge"]

[tool.coverage.report]
show_missing = true
skip_empty = true

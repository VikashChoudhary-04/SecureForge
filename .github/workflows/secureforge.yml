# SecureForge CI security verification

name: SecureForge Security Verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-verification:
    name: SecureForge Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SecureForge
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ".[dev]"

      - name: Verify SecureForge CLI
        run: |
          secureforge version

      - name: Run SecureForge tests
        run: |
          pytest -q

      - name: Run deterministic SecureForge CI verification
        run: |
          secureforge scan \
            --profile ci \
            --source-path . \
            --scan-id "github-${{ github.run_id }}" \
            --application "SecureForge" \
            --version "${{ github.sha }}" \
            --commit-sha "${{ github.sha }}" \
            --environment ci \
            --output reports/ci \
            --scan-storage .secureforge/scans

      - name: Upload SecureForge reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secureforge-security-reports
          path: |
            reports/ci/
            .secureforge/scans/
          if-no-files-found: ignore


# SecureForge GitHub Actions workflow

name: SecureForge Security Verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-verification:
    name: SecureForge Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SecureForge
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ".[dev]"

      - name: Verify SecureForge CLI
        run: |
          secureforge version

      - name: Run SecureForge tests
        run: |
          pytest -q

      - name: Validate project structure
        run: |
          test -f README.md
          test -f pyproject.toml
          test -d secureforge
          test -d tests
          test -d requirements
          test -d policies
          test -d vulnerable-app/securecommerce

      - name: Verify security documentation
        run: |
          test -f docs/methodology/validation.md
          test -f docs/methodology/retesting.md
          test -f 01-Foundations/README.md
          test -f 15-CI-CD/README.md

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secureforge-test-artifacts
          path: |
            .pytest_cache/
            reports/
            .secureforge/
          if-no-files-found: ignore

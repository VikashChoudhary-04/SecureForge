security_gate:
  name: default
  description: "Default SecureForge release security policy."

critical:
  action: block
high:
  action: block
medium:
  action: review
low:
  action: pass
info:
  action: pass

settings:
  require_confirmed_critical: true
  require_confirmed_high: true
  fail_on_tool_error: true
  fail_on_regression_failure: true

exceptions:
  enabled: true
  require_approval: true
  require_reason: true
  require_expiry: true

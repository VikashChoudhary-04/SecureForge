requirements:

* requirement_id: SF-AUTH-001
  title: Strong Authentication
  description: >
  Authentication mechanisms must protect user accounts against
  weak credential handling, insecure authentication flows, and
  common authentication weaknesses.
  category: authentication
  status: active
  owasp: A07:2025
  cwe:

  * CWE-287
  * CWE-521
  * CWE-798
    verification_methods:
  * sast
  * dast
  * api
  * manual
    mandatory: true

* requirement_id: SF-AUTH-002
  title: Secure Session Management
  description: >
  Authenticated sessions must be securely created, maintained,
  expired, and invalidated to prevent session abuse.
  category: authentication
  status: active
  owasp: A07:2025
  cwe:

  * CWE-384
  * CWE-613
    verification_methods:
  * dast
  * api
  * manual
    mandatory: true

* requirement_id: SF-AUTHZ-001
  title: Object-Level Authorization
  description: >
  Users must only be able to access objects and resources that
  they are authorized to access.
  category: authorization
  status: active
  owasp: API1:2023
  cwe:

  * CWE-639
  * CWE-862
    verification_methods:
  * api
  * dast
  * manual
  * regression
    mandatory: true

* requirement_id: SF-AUTHZ-002
  title: Function-Level Authorization
  description: >
  Privileged application and API functions must enforce
  authorization according to the authenticated user's role.
  category: authorization
  status: active
  owasp: API5:2023
  cwe:

  * CWE-862
  * CWE-863
    verification_methods:
  * api
  * dast
  * manual
  * regression
    mandatory: true

* requirement_id: SF-API-001
  title: API Authentication and Authorization
  description: >
  Security-sensitive API endpoints must enforce appropriate
  authentication and authorization controls.
  category: api
  status: active
  owasp: API2:2023
  cwe:

  * CWE-306
  * CWE-862
  * CWE-863
    verification_methods:
  * api
  * dast
  * manual
    mandatory: true

* requirement_id: SF-API-002
  title: API Input and Response Security
  description: >
  APIs must validate untrusted input and avoid exposing
  unnecessary sensitive information in responses.
  category: api
  status: active
  owasp: API3:2023
  cwe:

  * CWE-20
  * CWE-200
  * CWE-201
    verification_methods:
  * api
  * dast
  * sast
    mandatory: true

* requirement_id: SF-INPUT-001
  title: Injection-Safe Input Handling
  description: >
  Untrusted application input must be safely handled so that it
  cannot alter the intended behavior of interpreters or data stores.
  category: input
  status: active
  owasp: A05:2025
  cwe:

  * CWE-20
  * CWE-79
  * CWE-89
  * CWE-918
    verification_methods:
  * sast
  * dast
  * api
  * manual
  * regression
    mandatory: true

* requirement_id: SF-SECRET-001
  title: Secret Protection
  description: >
  Credentials, API keys, tokens, private keys, and other secrets
  must not be exposed through source code, configuration, logs,
  artifacts, or application responses.
  category: secret
  status: active
  owasp: A02:2025
  cwe:

  * CWE-798
  * CWE-321
  * CWE-312
    verification_methods:
  * secrets
  * sast
  * manual
  * regression
    mandatory: true

* requirement_id: SF-DEP-001
  title: Dependency Security
  description: >
  Application dependencies must be identified and evaluated for
  known security vulnerabilities and unacceptable versions.
  category: dependency
  status: active
  owasp: A03:2025
  cwe:

  * CWE-1104
  * CWE-1395
    verification_methods:
  * sca
  * manual
    mandatory: true

* requirement_id: SF-CONTAINER-001
  title: Secure Container Configuration
  description: >
  Application containers must follow secure configuration
  practices including least privilege, appropriate users,
  controlled ports, and secure runtime configuration.
  category: container
  status: active
  owasp: A05:2025
  cwe:

  * CWE-250
  * CWE-269
  * CWE-16
    verification_methods:
  * container
  * manual
    mandatory: true

* requirement_id: SF-IAC-001
  title: Secure Infrastructure Configuration
  description: >
  Infrastructure-as-code configurations must avoid unnecessary
  public exposure, excessive permissions, insecure storage,
  and other dangerous infrastructure defaults.
  category: infrastructure
  status: active
  owasp: A05:2025
  cwe:

  * CWE-16
  * CWE-269
  * CWE-732
    verification_methods:
  * iac
  * manual
    mandatory: true

* requirement_id: SF-TRANSPORT-001
  title: Secure Transport
  description: >
  Security-sensitive application and API communications must use
  appropriate transport protection and must not expose sensitive
  information through insecure communication channels.
  category: transport
  status: active
  owasp: A04:2025
  cwe:

  * CWE-319
  * CWE-326
    verification_methods:
  * dast
  * api
  * manual
  * wireshark
    mandatory: true

* requirement_id: SF-REG-001
  title: Security Regression Protection
  description: >
  Confirmed security vulnerabilities that are suitable for
  automation must have repeatable regression tests to prevent
  reintroduction.
  category: regression
  status: active
  owasp: null
  cwe: []
  verification_methods:

  * regression
  * manual
    mandatory: false
